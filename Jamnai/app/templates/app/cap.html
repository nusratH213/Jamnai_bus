<!DOCTYPE html>
<html>
<head>
  <title>Camera WebSocket Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    video { width: 100%; max-width: 480px; border: 2px solid black; }
    #log { white-space: pre-wrap; background: #eee; padding: 10px; height: 150px; overflow-y: auto; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>📷 Live Camera Stream</h2>
  <video id="video" autoplay playsinline></video>
  <div id="log"></div>

  <script>
    const log = msg => {
      const t = new Date().toLocaleTimeString();
      const out = `[${t}] ${msg}`;
      document.getElementById("log").textContent += out + "\n";
      console.log(out);
    };

    async function start() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log("❌ Your browser does NOT support getUserMedia.");
        alert("Use Chrome or Firefox, and serve over HTTP.");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById("video").srcObject = stream;
        log("✅ Camera access granted.");

        const socket = new WebSocket("ws://" + location.host + "/ws/stream/");
        socket.onopen = () => log("🔌 WebSocket connected");
        socket.onerror = (e) => log("❌ WebSocket error: " + e.message);
        socket.onclose = () => log("🔌 WebSocket closed");

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 320;
        canvas.height = 240;

        setInterval(() => {
          if (socket.readyState === WebSocket.OPEN) {
            ctx.drawImage(document.getElementById("video"), 0, 0, canvas.width, canvas.height);
            const base64 = canvas.toDataURL("image/jpeg", 0.5).split(",")[1];
            socket.send(base64);
            log("📤 Sent frame of size: " + base64.length + " bytes");
          }
        }, 500);

      } catch (err) {
        log("❌ Camera error: " + err.name + " - " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", start);
  </script>
</body>
</html>
